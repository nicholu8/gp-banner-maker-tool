name: Release

# Runs tests on every push/PR; when a version tag (v1.2.3) is pushed, also builds the
# installer and publishes a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -X faulthandler -m pytest -q -p no:cacheprovider
          Write-Host "pytest exit code: $LASTEXITCODE"
          exit $LASTEXITCODE

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (python -c "import growbanner; print(growbanner.__version__)").Trim()
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($v -ne $tag) { throw "Tag $tag does not match growbanner.__version__ $v" }

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build app, installer and zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: powershell -File packaging\build.ps1

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist-installer/* `
            --title "GP Banner Maker Tool ${{ github.ref_name }}" `
            --generate-notes
